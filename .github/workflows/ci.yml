name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same branch/PR so pushes don't queue behind
# stale ones and burn Actions minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # "Configured backend" smoke suite (e2e-mocked/): a real browser against the
  # app with VITE_SUPABASE_* set, Supabase network calls intercepted rather
  # than hitting a real backend (see e2e-mocked/helpers/mockSupabase.ts). The
  # `build` job above always runs unconfigured (no VITE_SUPABASE_*), so
  # without this, nothing in CI ever exercised the configured code path —
  # exactly the branch that shipped a crash once (useAuth calling GoTrue
  # unconditionally). No Docker/Postgres needed, unlike db-tests below or the
  # full e2e/ suite, so it runs in every job's fast path.
  e2e-mocked:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run configured-backend E2E suite
        run: pnpm test:e2e:mocked

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-mocked-report
          path: playwright-report/
          retention-days: 7

  # Combined coverage (unit + the configured-backend e2e-mocked/ suite, both
  # Docker-free) merged into one report with Monocart Coverage Reports — see
  # scripts/merge-coverage.mjs and CLAUDE.md. The real e2e/ suite needs the
  # local Supabase stack, so it isn't part of this job; run `pnpm coverage`
  # locally (with `pnpm local:up`) for a report that includes it too.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this job needs to write: it may open (never merge) a PR that
    # refreshes badges/coverage.svg. It cannot push to main directly.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run combined coverage (unit + e2e-mocked)
        run: pnpm coverage:ci

      - name: Add coverage summary
        if: always()
        run: cat coverage/merged/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-merged
          path: coverage/merged/
          retention-days: 7

      - name: Generate coverage badge
        if: github.event_name == 'push'
        run: node scripts/generate-coverage-badge.mjs

      - name: Open PR with updated coverage badge
        if: github.event_name == 'push'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: badges/coverage.svg
          commit-message: 'chore(badge): update coverage badge'
          branch: ci/coverage-badge
          delete-branch: true
          title: 'chore(badge): update coverage badge'
          body: Auto-generated from the latest `coverage` job on `${{ github.ref_name }}`.

  # The agent-loop tooling under scripts/agent/ (specs/agent/*). Its suite is a
  # separate vitest config that needs neither Docker nor a browser, so it does
  # not belong in `build` above — and it is the only job that can produce the
  # coverage the fallow audit depends on.
  #
  # That dependency is the point of running the audit here rather than trusting
  # the local `.claude/hooks/fallow-gate.sh`: the hook only gates the machine it
  # runs on, and it deliberately fails open. `pnpm agent:audit` fails closed on
  # missing or stale coverage, so "the gate passed" cannot mean "the gate never
  # actually looked" (see scripts/agent-audit.mjs).
  agent-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The audit diffs against a base ref, so it needs real history —
          # the default shallow clone has no merge-base to compare with.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs the suite *and* writes coverage/agent/coverage-final.json, which the
      # audit step below requires. One command, so the two cannot drift apart.
      - name: Run agent tooling tests with coverage
        run: pnpm agent:test:coverage

      - name: Fallow audit (dead code, complexity, duplication)
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            pnpm agent:audit --base "origin/${{ github.base_ref }}"
          else
            # Push builds have no PR base; audit the pushed commit itself.
            pnpm agent:audit --base HEAD^
          fi

  # Server logic now lives in SQL (RLS + push_records + validate_record), so it's
  # covered by pgTAP against a real local Postgres. This boots only the DB
  # container, applies the migrations + seed, and runs the suite. Kept as a
  # separate job so the fast JS checks above aren't blocked on Docker (D4).
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local database (applies migrations + seed)
        run: supabase db start

      - name: Run pgTAP suite
        run: supabase test db
