name: Fallow

on:
  pull_request:

# Separate from ci.yml so the write-scoped pull-requests permission needed to
# post review comments doesn't leak into the build/test/lint workflow.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: fallow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: audit diffs changed files against the PR base ref.
          fetch-depth: 0

      - name: Fallow audit (new-only)
        uses: fallow-rs/fallow@v3
        with:
          command: audit
          # New-only: fail only on findings this PR newly introduces, not
          # pre-existing/inherited ones already in the changed files. Matches
          # the local commit gate (.claude/hooks/fallow-gate.sh, --gate-marker).
          gate: new-only
          fail-on-issues: true
          review-comments: true
          review-guidance: true
          # Avoid the Fallow Cloud broker call; post as github-token instead
          # of the branded app (no Fallow Cloud account configured here).
          branded-token: false
