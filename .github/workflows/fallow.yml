name: Fallow

on:
  pull_request:

# Separate from ci.yml so the write-scoped pull-requests permission needed to
# post review comments doesn't leak into the build/test/lint workflow.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: fallow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: audit diffs changed files against the PR base ref.
          fetch-depth: 0

      - name: Fallow strict audit
        uses: fallow-rs/fallow@v2
        with:
          command: audit
          # Strict: fail on every finding fallow surfaces in changed files,
          # not just ones newly introduced by this PR (gate: new-only).
          gate: all
          fail-on-issues: true
          review-comments: true
          review-guidance: true
          # Avoid the Fallow Cloud broker call; post as github-token instead
          # of the branded app (no Fallow Cloud account configured here).
          branded-token: false
